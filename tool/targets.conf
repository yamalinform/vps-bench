# targets.conf — цели сетевых замеров (A6).
#
# Формат:  метка<пробел>адрес<пробел>порт_iperf3<пробел>порт_irtt<пробел>порт_tls
#
# ⚠ В результаты попадает ТОЛЬКО МЕТКА: соответствие «метка → адрес» живёт здесь
# и никуда не выгружается. Поэтому метки должны быть говорящими.
#
# Порты по умолчанию: iperf3 5201, irtt 2112, TLS-плечо 15201.
# Строки с # игнорируются. Цели выбираются флагом --targets метка1,метка2
# (без флага — все перечисленные).
#
# ⚠ На каждой цели должна быть поднята приёмная сторона: agent/agent-up.sh
# Вторая машина не обязана быть VPS — годится и ноутбук.
#
# Ниже ПРИМЕРЫ, все закомментированы. Раскомментируйте и впишите свои адреса,
# иначе сетевой модуль честно сообщит, что целей нет, и пометит метрики
# как «не измерено».
#
#lan      192.168.10.10    5201  2112  15201
#peer-eu  198.51.100.10    5201  2112  15201
#peer-ru  203.0.113.20     5201  2112  15201
